# ~~ Generated by projen in mxr/base. Modifications will be overwritten on the next sync. To modify properly, edit .github/base.yml and retrigger the propagate workflow in mxr/base.

ci:
  skip: [clippy] # runs via GHA to avoid keeping deps in-sync here

repos:
- repo: https://github.com/AndrejOrsula/pre-commit-cargo
  rev: 33ae92ed9b1a4392c8ac5fdef46887640d866e1e  # frozen: 0.5.0
  hooks:
  - id: cargo-fmt
- repo: https://github.com/biomejs/pre-commit
  rev: 8a54093106c1c85f977afbb95ada8685786a2999  # frozen: v2.5.11
  hooks:
  - id: biome-check
- repo: https://github.com/doublify/pre-commit-rust
  rev: eeee35a89e69d5772bdee97db1a6a898467b686e  # frozen: v1.0
  hooks:
  - id: clippy
    args:
    - --all-targets
    - --locked
    - --
    - -D
    - warnings
    - -D
    - clippy::pedantic
    - -D
    - clippy::nursery
    - -D
    - clippy::cargo
  - id: fmt
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --trailing-commas]
    exclude: Cargo.lock
  - id: pretty-format-yaml
    args: [--autofix]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
    args: [--assume-in-merge]
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint
    additional_dependencies: [github.com/wasilibs/go-shellcheck/cmd/shellcheck@latest]
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce  # frozen: v1.30.0
  hooks:
  - id: zizmor
    args: [--no-progress, --fix]
- repo: local
  hooks:
  - id: biome-schema-version
    name: biome schema version
    entry: |-
      python3 -c 'import re, pathlib; cfg = pathlib.Path(".pre-commit-config.yaml").read_text(); ver = re.search(r"biomejs/pre-commit.*?frozen: v([0-9.]+)", cfg, re.S)[1]; p = pathlib.Path("biome.json"); p.write_text(re.sub(r"schemas/[^/]+/schema\.json", f"schemas/{ver}/schema.json", p.read_text()))'
    language: python
    files: ^(biome\.json|\.pre-commit-config\.yaml)$
    pass_filenames: false
