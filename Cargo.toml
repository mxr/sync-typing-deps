[package]
name = "sync-typing-deps"
version = "0.7.1"
edition = "2021"
description = "Sync typing hook additional_dependencies from project dev deps"
readme = "README.md"
repository = "https://github.com/mxr/sync-typing-deps"
license = "MIT"
keywords = ["mypy", "pre-commit", "ty", "typing"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sync-typing-deps"
path = "src/main.rs"

[dependencies]
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml = "1.1"

[dev-dependencies]
rstest = "0.27"
tempfile = "3"
